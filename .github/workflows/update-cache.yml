name: Update Releases Cache

on:
  repository_dispatch:
    types: [ update-catalog-cache ]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cache
  cancel-in-progress: true

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove older workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' |
            tail -n+100 |
            xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

      - name: Fetch releases from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS=(
            "sharath-5br2r-apps/revanced-morphe-xposed-builder"
            "sharath-5br2r-apps/Dolphin-Extra"
            "sharath-5br2r-apps/LeviLaunchroid-Extra"
            "sharath-5br2r-apps/sharath-5br2r-apps.github.io"
          )

          echo "[]" > releases_new.json

          for repo in "${REPOS[@]}"; do
            echo "Fetching releases for $repo..."
            gh api --paginate "repos/$repo/releases" | jq --arg repo "$repo" '
              if type == "array" then
                map(. + {
                  repoOwner: ($repo | split("/")[0]),
                  repoName: ($repo | split("/")[1]),
                  repoUrl: "https://github.com/\($repo)"
                })
              else
                []
              end
            ' > tmp_repo.json

            jq -s '.[0] + .[1]' releases_new.json tmp_repo.json > merged.json && mv merged.json releases_new.json
          done
          rm -f tmp_repo.json

          # Validate: must be a non-empty JSON array
          COUNT=$(jq 'if type == "array" then length else 0 end' releases_new.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::GitHub API returned an empty releases array. Aborting to preserve existing cache."
            exit 1
          fi

          echo "Fetched $COUNT total releases. Updating cache."
          python3 .github/scripts/merge_build_meta.py
          rm -f releases_new.json

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update releases cache and master build metadata [skip ci]"
          file_pattern: "releases.json builds.json"
