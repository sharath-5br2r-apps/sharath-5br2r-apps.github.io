name: Update Releases Cache

on:
  repository_dispatch:
    types: [ update-catalog-cache ]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cache
  cancel-in-progress: true

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove older workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' |
            tail -n+100 |
            xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

      - name: Fetch releases from 5 repos and update catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/merge_build_meta.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update catalog data cache [skip ci]"
          file_pattern: "data.json data.json.gz"
